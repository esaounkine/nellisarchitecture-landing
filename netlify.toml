[build]
  command = "node build-news.js"
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/wp-content/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[redirects]]
  from = "/wp-admin/*"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/AGENTS.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/README.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/docs/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/content/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/build/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/build-news.js"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/package.json"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/package-lock.json"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/eslint.config.mjs"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/test/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/pravicy"
  to = "/privacy/"
  status = 301

# Old WordPress feed URLs (card XP9tXnDS). Netlify matches a "from" with and without the trailing slash.
[[redirects]]
  from = "/feed"
  to = "/feed.xml"
  status = 200

[[redirects]]
  from = "/feed/atom"
  to = "/feed/"
  status = 301

[[redirects]]
  from = "/feed/rss"
  to = "/feed/"
  status = 301

[[redirects]]
  from = "/rss"
  to = "/feed/"
  status = 301

[[redirects]]
  from = "/comments/feed"
  to = "/"
  status = 301

[[redirects]]
  from = "/news/:slug/feed"
  to = "/news/:slug/"
  status = 301

# Old WordPress news archives (card Gn13FGP1): tag, category and author lists go to the news index.
[[redirects]]
  from = "/news/tag/*"
  to = "/news/"
  status = 301

[[redirects]]
  from = "/news/category/*"
  to = "/news/"
  status = 301

[[redirects]]
  from = "/news/author/*"
  to = "/news/"
  status = 301
