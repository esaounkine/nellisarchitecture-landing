      <form class="projectForm"{{FORM_ID}} name="contact" action="/api/message" method="post">
        <p hidden><label>Leave empty: <input name="bot-field"></label></p>
        <input type="hidden" name="form" value="contact">
        
        <input
          type="text"
          name="name"
          class="name"
          placeholder="Name"
          required />
        <input
          type="email"
          name="email"
          class="email"
          placeholder="E-mail *"
          required />
        <input
          type="tel"
          name="phone"
          class="phoneNumber"
          placeholder="Phone number"
          required />
        <textarea
          name="massage"
          id="massage"
          class="massage"
          placeholder="Your message *"></textarea>


        <div class="policyLink">
          By submitting this form, I consent to the
          <a href="/privacy/" target="_blank">Privacy Policy.</a>
        </div>
        <button type="submit">{{BUTTON}}</button>
      </form>
