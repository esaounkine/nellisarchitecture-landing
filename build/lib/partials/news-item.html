                    <article class="newsIndexItem">
                        <div class="newsIndexImg">
                            {{PICTURE}}
                        </div>
                        <div class="newsIndexText">
                            <time class="newsIndexDate" datetime="{{ISO}}">{{DATE}}</time>
                            <h3 class="newsIndexTitle"><a href="{{HREF}}">{{TITLE}}</a></h3>
                            <p class="newsIndexExcerpt">{{EXCERPT}}</p>
                        </div>
                    </article>
